name: Import qualified v0.34 runtime
on:
  push:
    branches: [polish/procedural-sky-v034]
    paths: [.github/workflows/import-v034.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Transfer public-runtime-only artifact
        env:
          RUNTIME_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-e974-81f5-8cb1-bb561cc9c906/raw?se=2026-11-03T02%3A23%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=560036da-d79a-539e-b646-c247c59b475f&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T00%3A21%3A53Z&ske=2026-11-04T00%3A21%3A53Z&sks=b&skv=2026-02-06&sig=WKdtUMaIRdGJO1pcKLGb6PyzNGJF5upRAZ4ojL5a0xI%3D'
        run: |
          curl --fail --silent --show-error --location "$RUNTIME_URL" -o /tmp/public-runtime.zip
          echo '1ecb566b7b312dc1ec0e6eb4e7adc8704481157bec92c36d9a936fca721a4506  /tmp/public-runtime.zip' | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json, re
          expected='c07b2a470304b4e21a78ed7081f5b679d81a9cdd5f954d59f2273fc6a91b67b5'
          with ZipFile('/tmp/public-runtime.zip') as z:
              assert z.namelist()==['SCRAPYARD_SHUTDOWN.html'], 'Refuse unexpected/private artifact content'
              runtime=z.read('SCRAPYARD_SHUTDOWN.html')
          assert hashlib.sha256(runtime).hexdigest()==expected
          assert hashlib.sha256(Path('game.html').read_bytes()).hexdigest()=='e9e1002c414806c9625b7a91799f9b9c7a5b92ba2179a7d1cc60c5e2a7dc5cb8', 'Public baseline changed'
          Path('game.html').write_bytes(runtime)
          p=Path('index.html')
          text=p.read_text().replace('v0.33','v0.34')
          text=re.sub(r'<title>.*?</title>','<title>SCRAPYARD SHUTDOWN &middot; tront</title>',text)
          text=re.sub(r'>tront\.xyz[^<]*</a>','>tront.xyz &#8599;</a>',text)
          text=text.replace('href="game.html"','href="game.html?v=0.34"').replace('src="game.html"','src="game.html?v=0.34"')
          old="if(location.hash)document.querySelector('#game').src='game.html'+location.hash;"
          assert old in text
          text=text.replace(old,"const gameURL=new URL('game.html',location.href);gameURL.search=location.search;gameURL.searchParams.set('v','0.34');gameURL.hash=location.hash;document.querySelector('#game').src=gameURL.href;")
          p.write_text(text)
          p=Path('README.md')
          p.write_text(p.read_text().replace('v0.33','v0.34')+'\n## v0.34\n\nAdds a one-triangle procedural sky with drifting clouds, horizon haze and an aligned sun. Charged wrench hits now deal 72 damage and have a charge-ready cue. Existing interiors are unchanged. The launch page forwards seed/debug parameters and uses a versioned game URL.\n\nVerified with the existing source regression suite, sky resource/depth tests, matched browser captures, and complete objective-loop checks on seeds 42, 1337 and 9001. Measured sky overhead: one draw call and one triangle; two noise texture samples. `release.json` records the exact runtime checksum.\n')
          Path('release.json').write_text(json.dumps({'version':'0.34','runtime':'game.html','sha256':expected,'qualified':True,'qaSeeds':[42,1337,9001],'indoorPixelsUnchanged':True,'skyDrawCallDelta':1,'skyTriangleDelta':1},indent=2)+'\n')
          PY
      - name: Commit exact runtime and launch-page updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-v034.yml
          git add game.html index.html README.md release.json
          git commit -m 'Release v0.34: procedural sky and charged wrench feedback'
          git push origin HEAD:polish/procedural-sky-v034
