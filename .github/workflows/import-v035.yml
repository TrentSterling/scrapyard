name: Import qualified v0.35 runtime
on:
  push:
    branches: [polish/sculpted-clouds-v035]
    paths: [.github/workflows/import-v035.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import hash-verified public runtime
        env:
          RUNTIME_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-6430-81f5-8e03-d73528f3665f/raw?se=2026-11-03T03%3A13%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=69314501-a9d4-528d-94b6-2d2fc0223f2e&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T00%3A27%3A01Z&ske=2026-11-04T00%3A27%3A01Z&sks=b&skv=2026-02-06&sig=IUI7g%2B8GftiL1v4FEb9ubgbFHOO6fdeqq%2Bzqq5fUJjU%3D'
        run: |
          curl --fail --silent --show-error --location "$RUNTIME_URL" -o /tmp/release.zip
          echo '01815ec9ab41c027f7c611b5d9b0243da23da88b658bc3382b738d439f394c99  /tmp/release.zip' | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json
          expected='a4f337f67f236949953890e9d7e289eab9ddae5ca8bb01bb2a6a815523a3f416'
          allowed={'SCRAPYARD_SHUTDOWN.html','release-evidence/baseline.html','release-evidence/browser-smoke.json'}
          allowed.update('release-evidence/'+state+'-'+view+'.png' for state in ['before','after'] for view in ['indoors','sun','wide','yard'])
          with ZipFile('/tmp/release.zip') as z:
              assert set(z.namelist())==allowed, 'Unexpected artifact content'
              runtime=z.read('SCRAPYARD_SHUTDOWN.html')
              report=json.loads(z.read('release-evidence/browser-smoke.json'))
          assert report['passed'] and not report['errors'] and report['indoorPixelsUnchanged']
          assert all(report['qa'][str(seed)]['passed'] for seed in [42,1337,9001])
          assert report['captures']['after']['sky']['textureSamples']==4
          assert report['captures']['after']['render']['calls']==report['captures']['before']['render']['calls']
          assert report['captures']['after']['render']['triangles']==report['captures']['before']['render']['triangles']
          assert hashlib.sha256(runtime).hexdigest()==expected
          assert hashlib.sha256(Path('game.html').read_bytes()).hexdigest()=='c07b2a470304b4e21a78ed7081f5b679d81a9cdd5f954d59f2273fc6a91b67b5', 'Public baseline changed'
          Path('game.html').write_bytes(runtime)
          p=Path('index.html')
          text=p.read_text()
          assert 'v0.34' in text and "set('v','0.34')" in text
          text=text.replace('v0.34','v0.35').replace('v=0.34','v=0.35').replace("set('v','0.34')","set('v','0.35')")
          p.write_text(text)
          p=Path('README.md')
          text=p.read_text().replace('public runtime release of v0.34','public runtime release of v0.35')
          text+='\n## v0.35\n\nSky-only upgrade: rounded cloud banks, animated UV displacement, single-offset heightfield parallax, directional relief and sun occlusion. The yard lighting, fog, materials and gameplay are unchanged.\n\nThe sky remains one opaque triangle and one draw call. It uses four texture samples instead of two, with one startup-generated 256x256 packed height/gradient/noise texture (349524 bytes with mipmaps). No raymarching, transparent cloud meshes, render targets or additional lights.\n\nAll 22 existing regression entry points and 27 gameplay checks across seeds 42, 1337 and 9001 passed in qualification. Matched browser captures retained exactly 57 draw calls and 56069 triangles in the test view; the covered entry was pixel-identical to v0.34. Chromium/SwiftShader tests establish correctness, not hardware GPU frame times.\n'
          p.write_text(text)
          Path('verification/v035-qualification.json').write_text(json.dumps(report,indent=2)+'\n')
          Path('release.json').write_text(json.dumps({'version':'0.35','runtime':'game.html','sha256':expected,'qualified':True,'qaSeeds':[42,1337,9001],'indoorPixelsUnchanged':True,'drawCallDeltaFromV034':0,'triangleDeltaFromV034':0,'sky':{'style':'sculpted-v035','drawCalls':1,'triangles':1,'textureSamples':4,'noiseSize':256,'textureBytesWithMips':349524,'raymarchSteps':0}},indent=2)+'\n')
          PY
      - name: Commit qualified runtime and release metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-v035.yml
          git add game.html index.html README.md release.json verification/v035-qualification.json
          git commit -m 'Release v0.35: sculpted parallax clouds'
          git push origin HEAD:polish/sculpted-clouds-v035
