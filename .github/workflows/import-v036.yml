name: Import verified original WHACKO sky
on:
  push:
    branches: [fix/whacko-sky-v036]
    paths: [.github/workflows/import-v036.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Transfer only the tested public runtime
        env:
          RUNTIME_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-95b0-81f5-b20f-8a3dfd454001/raw?se=2026-11-03T05%3A07%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=6b8ce70a-a78f-5b25-b99e-7ec359232b69&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T00%3A36%3A37Z&ske=2026-11-04T00%3A36%3A37Z&sks=b&skv=2026-02-06&sig=wXfiZJ0M%2BJjP3vtCxKleP09CiBY5seT/9V%2BpXKjWlfM%3D'
        run: |
          curl --fail --silent --show-error --location "$RUNTIME_URL" -o /tmp/runtime.zip
          echo '8900011e908a9cb1b56dee14230c13123a1c31b0c4cc8fff0186ad29466b88d4  /tmp/runtime.zip' | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,json
          expected='79a207cac55f53ba7acf9f2047ccb50eedcf0a9d505abba829fc85abab1e366a'
          with ZipFile('/tmp/runtime.zip') as z:
              assert z.namelist()==['SCRAPYARD_SHUTDOWN.html'], 'Unexpected non-runtime content'
              runtime=z.read('SCRAPYARD_SHUTDOWN.html')
          assert hashlib.sha256(runtime).hexdigest()==expected
          assert hashlib.sha256(Path('game.html').read_bytes()).hexdigest()=='a4f337f67f236949953890e9d7e289eab9ddae5ca8bb01bb2a6a815523a3f416', 'Public baseline changed'
          assert b'WHACKO SimpleOvercast' in runtime and b'data:image/png;base64,' in runtime
          Path('game.html').write_bytes(runtime)
          p=Path('index.html');s=p.read_text()
          assert 'v0.35' in s and "set('v','0.35')" in s
          s=s.replace('v0.35','v0.36').replace('v=0.35','v=0.36').replace("set('v','0.35')","set('v','0.36')")
          p.write_text(s)
          p=Path('README.md');s=p.read_text().replace('public runtime release of v0.35','public runtime release of v0.36')
          s+='\n## v0.36: Original WHACKO cloud ceiling\n\nCorrects v0.35, which shipped the sculpted-cloud substitute rather than the requested SimpleOvercast port. Restores the supplied 512x512 noise pixels, plane projection, two-sample parallax, sag 0.3, depth 2.42, density 6.84 and wind +0.05 UV/sec on both axes. Original linear purple/blue material values are used. The texture is embedded, repeat-wrapped, and bilinear level-zero sampled.\n\nOne opaque far-depth triangle, one draw call, two texture samples, no raymarch or extra lights. The game waits for the embedded PNG before becoming ready. This is a sky-only change; gameplay and yard lighting are unchanged.\n\nVerified: all 22 existing regression entry points, 27 built-in checks across three seeds, supplied-noise pixel hash, 1428 GPU/CPU comparisons of original height and Beer attenuation, visible motion over half a second, four-second in-game animation capture, pause behavior and pixel-identical covered interior. Readback maximum error was 0.001967; these are software-renderer correctness checks, not hardware FPS claims.\n'
          p.write_text(s)
          release={'version':'0.36','runtime':'game.html','sha256':expected,'qualified':True,'qaSeeds':[42,1337,9001],'indoorPixelsUnchanged':True,'drawCallDeltaFromV035':0,'triangleDeltaFromV035':0,'sky':{'style':'WHACKO SimpleOvercast','noiseSize':512,'textureSamples':2,'drawCalls':1,'triangles':1,'windUVPerSecond':[0.05,0.05],'parallaxDepth':2.42,'noisePixelSHA256':'76f7e0b78db663183f125ec202843df10ef3d4818d773d8bb22dbb8463b5873b'}}
          Path('release.json').write_text(json.dumps(release,indent=2)+'\n')
          p=Path('verification/live-smoke.mjs');s=p.read_text()
          old='assert.equal(report.state.sky.enabled, true);'
          assert old in s
          s=s.replace(old,old+"\n  assert.equal(report.state.sky.style, release.sky.style, 'Correct shader, not just any sky');\n  assert.equal(report.state.sky.loaded, true);\n  assert.equal(report.state.sky.noiseSize, 512);\n  assert.equal(report.state.sky.textureSamples, 2);\n  assert.equal(report.state.sky.parallaxDepth, 2.42);")
          old="await page.screenshot({path: out + '/live-courtyard.png', timeout: 120000});"
          assert old in s
          s=s.replace(old,old+"\n  await frame.evaluate(() => {__game.step(.5);__testDraw();});\n  report.skyClockAfterStepping = await frame.evaluate(() => __game.state.sky.time);\n  assert.ok(report.skyClockAfterStepping >= .5, 'Deployed shader clock advances');")
          p.write_text(s)
          PY
      - name: Commit exact qualified release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-v036.yml
          git add game.html index.html README.md release.json verification/live-smoke.mjs
          git commit -m 'Release v0.36: original WHACKO texture, cloud ceiling and swimming parallax'
          git push origin HEAD:fix/whacko-sky-v036
